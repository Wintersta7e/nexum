name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push that arrives while a previous run for the same ref is still
# going cancels the in-flight one — saves runner minutes on rapid
# pushes without losing the latest result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: Three-command gate (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Only persist a new cache when main moves; PR branches still
        # read from the latest main cache. Avoids cache thrash from
        # short-lived branches while keeping the warm-path for the gate.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml at repo root pins channel 1.95.0 + clippy + rustfmt.
        run: rustup show

      - name: Configure git identity for tests
        # The init_cli.rs subprocess test shells out to `git commit` from
        # nexum init's bootstrap-commit path. CI runners have no global
        # git config; without an identity, the commit fails before any
        # nexum logic runs. Generic CI identity matches the rest of the
        # subprocess test pattern (`nexum-test@example.invalid`).
        run: |
          git config --global user.name "nexum-ci"
          git config --global user.email "nexum-ci@example.invalid"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: cargo test (targets)
        run: cargo test --locked --workspace --all-targets

      - name: cargo test (doctests)
        # `--all-targets` excludes doctests; cover them in a second pass
        # so rustdoc examples in pub items are verified by the gate.
        run: cargo test --locked --workspace --doc

  coverage:
    name: Coverage (codecov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: "v0-coverage"

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Add llvm-tools-preview (needed by cargo-llvm-cov)
        # rust-toolchain.toml ships a minimal profile (clippy + rustfmt only);
        # llvm-cov needs the llvm-tools component to read the raw profiles.
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d832235cb306500b868c2632a137d48634568cd # v2
        with:
          tool: cargo-llvm-cov

      - name: Configure git identity for tests
        # Same as the gate: init's bootstrap-commit path shells out to
        # `git commit`, and CI runners have no global git identity.
        run: |
          git config --global user.name "nexum-ci"
          git config --global user.email "nexum-ci@example.invalid"

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --locked --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload to Codecov
        # fail_ci_if_error stays false so a codecov hiccup never breaks the
        # gate; the upload needs the repo onboarded + a CODECOV_TOKEN secret.
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deny:
    name: cargo-deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2

  msrv:
    name: MSRV verify (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Separate cache key so this job's MSRV target cache doesn't
        # collide with the main gate's cache (different toolchain,
        # same Cargo.lock).
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: "v0-msrv"

      - name: Install MSRV toolchain (1.95.0)
        # `workspace.package.rust-version = "1.95"` is the public MSRV
        # contract. Today rust-toolchain.toml also pins 1.95.0 so the
        # main gate already exercises this; the job exists so the
        # contract survives a future toolchain bump.
        run: rustup install 1.95.0 --profile minimal --no-self-update

      - name: cargo check (MSRV)
        run: cargo +1.95.0 check --workspace --locked --all-targets

  e2e:
    name: e2e harness (bundled fixtures)
    # Main-only: keeps PR turnaround fast. Smoke-tests the cc + codex
    # adapters against the synthetic fixtures checked in under `e2e/`.
    # No host secrets, no real ~/.claude or ~/.codex content.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: gate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build nexum (release)
        run: cargo build --locked --release -p nexum-cli

      - name: e2e cc adapter
        run: ./e2e/run.sh cc

      - name: e2e codex adapter
        run: ./e2e/run.sh codex
